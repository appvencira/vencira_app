name: vencira
description: Cliente multiplataforma VENCIRA
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.1.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # G8 is run only on an isolated Android emulator. Not part of runtime.
  integration_test:
    sdk: flutter
  # G7-E lab-only RFC 6238 TOTP generator (no production runtime dependency).
  crypto: ^3.0.6

flutter:
  generate: true
  uses-material-design: true
