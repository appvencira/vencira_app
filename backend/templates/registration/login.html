<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso a VENCIRA</title>
</head>
<body>
  <main>
    <h1>VENCIRA</h1>
    <p>Acceso de desarrollo. No introducir datos reales de clientes.</p>
    {% if form.errors %}<p role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.username.id_for_label }}">Usuario</label>
      {{ form.username }}
      <label for="{{ form.password.id_for_label }}">Contraseña</label>
      {{ form.password }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
