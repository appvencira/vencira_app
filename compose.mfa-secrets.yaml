# Optional MFA secret mount. NOT included by default in compose.yaml.
# Do not run against live services before a separate approved migration and release.
# Host path is supplied separately; do not commit a real path or key.
services:
  api:
    environment:
      VENCIRA_MFA_FERNET_KEYS_FILE: /run/secrets/vencira-mfa
      VENCIRA_MFA_ENROLLMENT_ENABLED: "0"
    volumes:
      - type: bind
        source: ${VENCIRA_MFA_SECRET_HOST_FILE:?MFA_secret_file_path_required}
        target: /run/secrets/vencira-mfa
        read_only: true
