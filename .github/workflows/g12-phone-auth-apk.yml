name: G12 Android physical synthetic auth APK (debug only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/flutter/lib/g12_lab_main.dart'
      - 'clients/flutter/lib/g12_lab/physical_auth_checks.dart'
      - 'clients/flutter/lib/api/native_first_issuance_entry.dart'
      - 'clients/flutter/lib/api/native_mobile_startup_gate.dart'
      - 'clients/flutter/lib/api/native_mobile_recovery_entry.dart'
      - 'clients/flutter/lib/api/native_session_coordinator.dart'
      - 'clients/flutter/lib/api/native_recovery_login_gateway.dart'
      - 'clients/flutter/lib/api/native_refresh_recovery_journal.dart'
      - 'clients/flutter/lib/api/native_refresh_credential_vault.dart'
      - 'clients/flutter/android/app/build.gradle.kts'
      - 'clients/flutter/android/app/src/main/AndroidManifest.xml'
      - 'clients/flutter/pubspec.yaml'
      - 'scripts/g12_phone_apk_build.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g12-phone-auth-apk.yml'
  push:
    branches:
      - feature/m3-android-local-notifications
    paths:
      - 'clients/flutter/lib/g12_lab_main.dart'
      - 'clients/flutter/lib/g12_lab/physical_auth_checks.dart'
      - 'clients/flutter/android/app/build.gradle.kts'
      - 'scripts/g12_phone_apk_build.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g12-phone-auth-apk.yml'

permissions:
  contents: read

jobs:
  g12-debug-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify N1 and build independently identified debug APK
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            ghcr.io/cirruslabs/flutter:stable \
            bash scripts/g12_phone_apk_build.sh

      - name: Publish synthetic G12 app for physical Android only
        uses: actions/upload-artifact@v4
        with:
          name: VENCIRA-G12-PHONE-DEBUG-ONLY
          path: |
            clients/flutter/build/g12-phone/VENCIRA-G12-LAB-debug.apk
            clients/flutter/build/g12-phone/VENCIRA-G12-LAB-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Keep physical and operational gates denied
        if: always()
        run: |
          echo 'G12_PHONE_PHYSICAL_AUTH_RESULT=NOT_RUN'
          echo 'G12_PHONE_RELEASE_AUTHORIZED=NO'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
