name: Bootstrap versioned Android project (feature branch only)
on:
  push:
    branches:
      - feature/mb1-m104-transition-contract-batch
    paths:
      - '.github/workflows/m3-android-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-bootstrap-feature-branch
  cancel-in-progress: false
jobs:
  version-android-project:
    if: github.repository == 'appvencira/vencira_app' && github.ref == 'refs/heads/feature/mb1-m104-transition-contract-batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold in feature working tree
        working-directory: clients/flutter
        run: |
          if test -e android/app/src/main/AndroidManifest.xml; then
            echo 'Android project already exists. No regeneration.'
            exit 1
          fi
          flutter pub get
          flutter create --platforms=android --org es --project-name vencira .
          test -e android/app/src/main/AndroidManifest.xml
          test -e android/gradlew
          test -e android/gradle/wrapper/gradle-wrapper.jar
      - name: Verify generated debug build without publishing
        working-directory: clients/flutter
        run: flutter build apk --debug
      - name: Commit ONLY scaffold, in the isolated branch
        run: |
          set -eu
          test -f clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          test "$(git branch --show-current)" = 'feature/mb1-m104-transition-contract-batch'
          git add -f -A clients/flutter/android
          git diff --cached --name-only | grep '^clients/flutter/android/'
          if git diff --cached --quiet; then
            echo 'No Android files to commit.'
            exit 1
          fi
          git config user.name 'vencira-ci[bot]'
          git config user.email 'appvencira@users.noreply.github.com'
          git commit -m 'chore(android): version isolated Android project after verified debug build'
          git push origin HEAD:feature/mb1-m104-transition-contract-batch
      - name: Keep release gates closed
        run: |
          echo 'ANDROID_SCAFFOLD_VERSIONED=YES'
          echo 'LOCAL_NOTIFICATIONS_IMPLEMENTED=NO'
          echo 'MFA_RELEASE_AUTHORIZED=NO'
          echo 'C_FICHA_RELEASE_AUTHORIZED=NO'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
