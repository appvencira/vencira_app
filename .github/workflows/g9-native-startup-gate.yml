name: G9 native startup fence unit batch (no backend)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/flutter/lib/api/native_mobile_startup_gate.dart'
      - 'clients/flutter/test/native_mobile_startup_gate_test.dart'
      - 'clients/flutter/lib/api/native_refresh_recovery_journal.dart'
      - 'clients/flutter/lib/api/native_refresh_credential_vault.dart'
      - 'clients/flutter/lib/api/native_session_coordinator.dart'
      - 'clients/flutter/lib/api/native_recovery_login_gateway.dart'
      - 'scripts/g9_native_startup_gate.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g9-native-startup-gate.yml'
  push:
    branches:
      - feature/m3-android-local-notifications
    paths:
      - 'clients/flutter/lib/api/native_mobile_startup_gate.dart'
      - 'clients/flutter/test/native_mobile_startup_gate_test.dart'
      - 'clients/flutter/lib/api/native_refresh_recovery_journal.dart'
      - 'clients/flutter/lib/api/native_refresh_credential_vault.dart'
      - 'clients/flutter/lib/api/native_session_coordinator.dart'
      - 'clients/flutter/lib/api/native_recovery_login_gateway.dart'
      - 'scripts/g9_native_startup_gate.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g9-native-startup-gate.yml'

permissions:
  contents: read

jobs:
  startup-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: G9 startup + recovery regression (public Pub cache only)
        run: bash scripts/g9_native_startup_gate.sh

      - name: No operational release
        if: always()
        run: |
          echo 'G9_OPERATIONAL_INTEGRATION=NOT_IMPLEMENTED'
          echo 'G9_PRODUCTION_AUTH_RELEASE=NO'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
