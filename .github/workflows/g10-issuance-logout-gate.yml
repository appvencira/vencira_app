name: G10 protected first issuance and logout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/flutter/lib/api/native_first_issuance_entry.dart'
      - 'clients/flutter/lib/api/native_session_coordinator.dart'
      - 'clients/flutter/lib/api/native_refresh_recovery_journal.dart'
      - 'clients/flutter/test/native_first_issuance_entry_test.dart'
      - 'scripts/g10_issuance_logout_gate.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g10-issuance-logout-gate.yml'

permissions:
  contents: read

jobs:
  isolated-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: G10 grouped Flutter tests
        run: bash scripts/g10_issuance_logout_gate.sh
      - name: No operational release
        if: always()
        run: |
          echo 'G10_OPERATIONAL_AUTH=NOT_ENABLED'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
