name: G11 first-issuance/logout real HTTPS lab (disposable only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/flutter/tool/g11_https_scenarios.dart'
      - 'clients/flutter/tool/g7_d2_https_probe.dart'
      - 'clients/flutter/lib/api/native_first_issuance_entry.dart'
      - 'clients/flutter/lib/api/native_session_coordinator.dart'
      - 'clients/flutter/lib/api/native_refresh_recovery_journal.dart'
      - 'scripts/g11_https_first_issue_logout.sh'
      - 'scripts/g7_d2_https_flutter_django.sh'
      - 'scripts/n1_static_security_gate.py'
      - '.github/workflows/g11-https-first-issuance.yml'

permissions:
  contents: read

jobs:
  g11-disposable-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: G11 only — Django tmpfs and verified CA, Flutter HTTP
        run: bash scripts/g11_https_first_issue_logout.sh
      - name: Release stays blocked
        if: always()
        run: |
          echo 'G11_OPERATIONAL_AUTH=NOT_ENABLED'
          echo 'G11_LIVE_DB_MIGRATION=NOT_RUN'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
