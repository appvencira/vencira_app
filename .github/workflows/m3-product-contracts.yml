name: M3 product contracts
on:
  push:
    branches:
      - main
      - feature/m3-android-local-notifications
  pull_request:
  workflow_dispatch:

jobs:
  django-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      VENCIRA_ENV: test
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-local-test-not-a-production-secret'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      VENCIRA_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check native authentication release boundary
        run: python ../scripts/n1_static_security_gate.py
      - name: Reject experimental session lab under production environment
        run: |
          if VENCIRA_ENV=production DJANGO_DEBUG=0 VENCIRA_NATIVE_SESSION_LAB=1 python manage.py check > /tmp/n1-prod-lab-denied.log 2>&1; then
            echo 'N1_LAB_PRODUCTION_FAILCLOSED=FAIL'
            exit 1
          fi
          grep -q 'Native device session lab only allowed in test' /tmp/n1-prod-lab-denied.log
          echo 'N1_LAB_PRODUCTION_FAILCLOSED=OK'
      - name: Validate grouped and targeted PG17 runner syntax
        run: |
          bash -n ../scripts/n1_verification_batch.sh
          bash -n ../scripts/n1_identity_pg17_ephemeral.sh
          bash -n ../scripts/m3_native_http_contract_batch.sh
      - name: Check Django project
        run: python manage.py check
      - name: Product control and suggestion tests
        run: python manage.py test reminders.test_native_mobile_auth_boundary reminders.test_native_mobile_identity_gate reminders.test_native_mobile_identity_database reminders.test_native_mobile_token_primitives reminders.test_reminder_planning reminders.test_control_intent reminders.test_person_suggestions_ranking reminders.test_control_responses reminders.test_control_response_api reminders.test_operational_transitions reminders.test_operational_inbox reminders.test_operational_api reminders.test_results reminders.test_device_notice_preview reminders.test_agenda
      - name: Validate test-only N1 device-session schema
        env:
          VENCIRA_NATIVE_SESSION_LAB: '1'
        run: |
          python manage.py makemigrations native_sessions_lab --check --dry-run
          python manage.py test reminders.test_native_mobile_identity_database reminders.test_native_mobile_token_primitives native_sessions_lab.tests native_sessions_lab.test_pg17_race native_sessions_lab.test_login_rules native_sessions_lab.test_pg17_login_race native_sessions_lab.test_http_contract_cases
      - name: Reject G4 candidate registration in production
        run: |
          if VENCIRA_ENV=production DJANGO_DEBUG=0 VENCIRA_NATIVE_SERVICE_CANDIDATE=1 python manage.py check > /tmp/g4-prod-candidate-denied.log 2>&1; then
            echo 'G4_CANDIDATE_PROD_GUARD=FAIL'
            exit 1
          fi
          grep -q 'Native mobile service candidate only allowed in isolated tests' /tmp/g4-prod-candidate-denied.log
          echo 'G4_CANDIDATE_PROD_GUARD=OK'
      - name: G4 candidate SQLite contract and schema dry-run
        env:
          VENCIRA_NATIVE_SERVICE_CANDIDATE: '1'
        run: |
          python manage.py makemigrations native_mobile_service --check --dry-run
          python manage.py test native_mobile_service.test_contract native_mobile_service.test_g5_network_identity native_mobile_service.test_g5_throttle native_mobile_service.test_g5_audit
      - name: No operational release
        run: |
          echo 'M3_02_DELIVERY=NOT_IMPLEMENTED'
          echo 'MB1_RELEASE_AUTHORIZED=NO'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'


  django-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vencira_m3_ci
          POSTGRES_USER: vencira_m3_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vencira_m3_ci -d vencira_m3_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      VENCIRA_ENV: test
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-local-test-not-a-production-secret'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      VENCIRA_DB_ENGINE: postgresql
      POSTGRES_DB: vencira_m3_ci
      POSTGRES_USER: vencira_m3_ci
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check native authentication release boundary
        run: python ../scripts/n1_static_security_gate.py
      - name: Check Django with PG17 configuration
        run: python manage.py check
      - name: Run O9b and operational inbox regressions on isolated PG17
        run: python manage.py test reminders.test_native_mobile_auth_boundary reminders.test_native_mobile_identity_gate reminders.test_native_mobile_identity_database reminders.test_native_mobile_token_primitives reminders.test_reminder_planning reminders.test_control_intent reminders.test_person_suggestions_ranking reminders.test_control_responses reminders.test_control_response_api reminders.test_operational_transitions reminders.test_operational_inbox reminders.test_operational_api reminders.test_results reminders.test_device_notice_preview reminders.test_agenda
      - name: Validate test-only N1 device-session schema
        env:
          VENCIRA_NATIVE_SESSION_LAB: '1'
        run: |
          python manage.py makemigrations native_sessions_lab --check --dry-run
          python manage.py test reminders.test_native_mobile_identity_database reminders.test_native_mobile_token_primitives native_sessions_lab.tests native_sessions_lab.test_pg17_race native_sessions_lab.test_login_rules native_sessions_lab.test_pg17_login_race native_sessions_lab.test_http_contract_cases
      - name: G4 candidate isolated PostgreSQL 17 contract and race
        env:
          VENCIRA_NATIVE_SERVICE_CANDIDATE: '1'
        run: |
          python manage.py makemigrations native_mobile_service --check --dry-run
          python manage.py test native_mobile_service.test_contract native_mobile_service.test_pg17_races native_mobile_service.test_g5_network_identity native_mobile_service.test_g5_throttle native_mobile_service.test_g5_pg17_races native_mobile_service.test_g5_audit
      - name: Keep release blocked
        run: |
          echo 'M3_02_PG17_EPHEMERAL_ONLY=1'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'

  flutter-inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/native_recovery_login_gateway_test.dart test/native_refresh_recovery_journal_test.dart test/native_workspace_read_port_test.dart test/native_http_auth_port_test.dart test/native_session_coordinator_test.dart test/native_login_screen_test.dart test/native_mobile_token_shape_test.dart test/native_refresh_credential_vault_test.dart test/native_api_transport_test.dart test/native_api_endpoint_test.dart test/android_web_access_screen_test.dart test/detail_expiry_navigation_test.dart test/session_denial_classifier_test.dart test/operational_inbox_test.dart test/operational_inbox_widget_test.dart test/operational_action_http_test.dart test/results_test.dart test/device_notice_preview_test.dart test/device_notice_reconciliation_test.dart test/device_notice_sync_test.dart test/device_notice_inventory_test.dart test/android_local_alarm_port_test.dart test/device_notice_transaction_test.dart test/device_notice_session_coordinator_test.dart test/device_notice_auth_identity_test.dart test/device_notice_consent_test.dart test/device_notice_logout_widget_test.dart test/device_notice_startup_gate_test.dart test/day_agenda_test.dart test/agenda_operational_event_test.dart test/agenda_today_inbox_test.dart
      - name: Compile Flutter Web without publishing
        run: flutter build web --release --pwa-strategy=none
