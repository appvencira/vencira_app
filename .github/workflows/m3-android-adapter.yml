name: M3 Android adapter compile (no release)
on:
  pull_request:
    paths:
      - 'clients/flutter/pubspec.yaml'
      - 'clients/flutter/android/app/build.gradle.kts'
      - 'clients/flutter/lib/notifications/**'
      - 'clients/flutter/test/device_notice_inventory_test.dart'
      - 'clients/flutter/test/device_notice_transaction_test.dart'
      - 'clients/flutter/test/android_local_alarm_port_test.dart'
      - '.github/workflows/m3-android-adapter.yml'
permissions:
  contents: read
jobs:
  android-adapter-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify versioned Android platform exists
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.jar
      - name: Enforce desugaring and backup protection from the versioned scaffold
        run: |
          grep -F 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze
      - name: Compile Android APK without distributing
        run: flutter build apk --debug
      - name: Compile release and verify permissions without distributing
        run: |
          flutter build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk-linux}/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk > /tmp/vencira-m3-release-badging.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" /tmp/vencira-m3-release-badging.txt
          if grep -q '^application-debuggable' /tmp/vencira-m3-release-badging.txt; then
            echo 'RELEASE_DEBUGGABLE=FAIL'
            exit 1
          fi
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          echo 'M3_RELEASE_MANIFEST_GATES=OK'
      - name: Non-release status
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo 'ANDROID_ADAPTER_COMPILES=YES'
          echo 'ANDROID_LOCAL_NOTIFICATIONS_ENABLED=NO'
          echo 'NO_DEPLOY_NO_LIVE_MIGRATION=1'
