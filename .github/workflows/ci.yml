name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vencira_ci
          POSTGRES_USER: vencira_ci
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vencira_ci -d vencira_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VENCIRA_ENV: test
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-longer-than-32-characters-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      VENCIRA_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests Django (SQLite)
        run: python manage.py test
      - name: Tests Django (PostgreSQL 17)
        run: python manage.py test
        env:
          VENCIRA_DB_ENGINE: postgresql
          POSTGRES_DB: vencira_ci
          POSTGRES_USER: vencira_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
