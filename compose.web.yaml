# Añadir únicamente para pruebas web locales:
# docker compose -f compose.yaml -f compose.web.yaml up --build -d
services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VENCIRA_WEB_BIND_PORT:-18732}:8080"
    volumes:
      - ./clients/flutter/build/web:/usr/share/nginx/html:ro
      - ./deploy/local-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
